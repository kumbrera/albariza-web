<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wordClip">
      <text
        x="320" y="98"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-weight="800"
        font-size="76"
        letter-spacing="6"
      >ALBARIZA</text>
    </clipPath>
  </defs>

  <text
    x="320" y="98"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="76"
    letter-spacing="6"
    fill="#c7c7cc"
  >ALBARIZA</text>

  <!-- diagonal sheen, clipped to the wordmark's own letterforms -->
  <g clip-path="url(#wordClip)">
    <rect x="-40" y="-20" width="720" height="180" fill="url(#sheen)" transform="rotate(-14 320 60)"/>
  </g>

  <text
    x="320" y="148"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="40"
    fill="#ffffff"
    fill-opacity="0.88"
  >Digital</text>
</svg>
