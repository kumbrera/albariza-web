<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="55%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="sheenWord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wordClip">
      <text
        x="600" y="330"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-weight="800"
        font-size="110"
        letter-spacing="10"
      >ALBARIZA</text>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <text
    x="600" y="330"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="110"
    letter-spacing="10"
    fill="#c7c7cc"
  >ALBARIZA</text>

  <g clip-path="url(#wordClip)">
    <rect x="-100" y="180" width="1400" height="260" fill="url(#sheenWord)" transform="rotate(-14 600 260)"/>
  </g>

  <text
    x="600" y="405"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="54"
    fill="#ffffff"
    fill-opacity="0.88"
  >Digital</text>

  <text
    x="600" y="480"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="500"
    font-size="28"
    letter-spacing="2"
    fill="#ffffff"
    fill-opacity="0.55"
  >MARKETING DIGITAL · IA &amp; AUTOMATIZACIÓN · CONSULTORÍA</text>

  <!-- small "A" mark echo -->
  <g transform="translate(560,500) scale(0.42)">
    <path d="M100,34 L44,166 L75,166 Z" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M100,34 L156,166 L125,166 Z" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="67" y="111" width="66" height="21" fill="#ffffff" fill-opacity="0.7"/>
  </g>
</svg>
