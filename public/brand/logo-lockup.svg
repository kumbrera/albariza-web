<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="55%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="sheenWord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wordClip2">
      <text
        x="400" y="290"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-weight="800"
        font-size="86"
        letter-spacing="8"
      >ALBARIZA</text>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="560" rx="28" fill="url(#bg)"/>

  <text
    x="400" y="290"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="86"
    letter-spacing="8"
    fill="#c7c7cc"
  >ALBARIZA</text>

  <g clip-path="url(#wordClip2)">
    <rect x="-100" y="150" width="1000" height="220" fill="url(#sheenWord)" transform="rotate(-14 400 250)"/>
  </g>

  <text
    x="400" y="352"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="46"
    fill="#ffffff"
    fill-opacity="0.88"
  >Digital</text>

  <!-- small "A" mark echo, bottom of the card -->
  <g transform="translate(360,430) scale(0.4)">
    <path d="M100,34 L44,166 L75,166 Z" fill="#ffffff"/>
    <path d="M100,34 L156,166 L125,166 Z" fill="#ffffff"/>
    <rect x="67" y="111" width="66" height="21" fill="#ffffff"/>
  </g>
</svg>
